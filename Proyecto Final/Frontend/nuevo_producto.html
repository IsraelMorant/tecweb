<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Agregar Producto</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link rel="stylesheet" href="css/nuevo_producto.css">
   
</head>
<body>

<div class="form-container">
    <h2>Nuevo Producto</h2>
    <input type="text" id="nombre" placeholder="Nombre del producto">
    <input type="number" id="precio" placeholder="Precio">
    <textarea id="descripcion" placeholder="Descripción"></textarea>
    <button id="agregarBtn">Guardar Producto</button>
    <div id="respuesta" class="msg"></div>
</div>

<script>
    $('#agregarBtn').on('click', function () {
        const data = {
            nombre: $('#nombre').val(),
            precio: $('#precio').val(),
            descripcion: $('#descripcion').val()
        };

        $.ajax({
            url: 'http://localhost:8080/tecweb/Proyecto%20Final/Backend/Api/index.php?method=add_product',
            method: 'POST',
            data: JSON.stringify(data),
            contentType: 'application/json',
            success: function (response) {
                const res = JSON.parse(response);
                const $msg = $('#respuesta');

                if (res.status === 'success') {
                    $msg.removeClass('error').addClass('success').text(res.message);
                    $('#nombre, #precio, #descripcion').val('');
                } else {
                    $msg.removeClass('success').addClass('error').text(res.message);
                }
            }
        });
    });
</script>

</body>
</html>
