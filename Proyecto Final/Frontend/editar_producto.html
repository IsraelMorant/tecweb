<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar Producto</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link rel="stylesheet" href="css/editar_producto.css"> 
</head>
<body>

<div class="container">
    <h2>Editar Producto</h2>

    <label>ID del Producto (obligatorio)</label>
    <input type="number" id="id" placeholder="ID del producto">

    <label>Nuevo nombre</label>
    <input type="text" id="nombre" placeholder="Nombre del producto">

    <label>Nuevo precio</label>
    <input type="number" id="precio" placeholder="Precio">

    <label>Nueva descripción</label>
    <textarea id="descripcion" placeholder="Descripción"></textarea>

    <button id="editarBtn">Actualizar Producto</button>

    <div id="respuesta" class="msg"></div>
</div>

<script>
    $('#editarBtn').on('click', function () {
        const id = $('#id').val();
        const nombre = $('#nombre').val();
        const precio = $('#precio').val();
        const descripcion = $('#descripcion').val();

        if (!id || !nombre) {
            $('#respuesta').removeClass().addClass('msg error').text('ID y nombre son obligatorios.');
            return;
        }

        const data = {
            id: id,
            nombre: nombre,
            precio: precio,
            descripcion: descripcion
        };

        $.ajax({
            url: '../Backend/Api/index.php?method=update_product',
            method: 'POST',
            data: JSON.stringify(data),
            contentType: 'application/json',
            success: function (res) {
                const r = JSON.parse(res);
                const $msg = $('#respuesta');
                if (r.status === 'success') {
                    $msg.removeClass().addClass('msg success').text(r.message);
                } else {
                    $msg.removeClass().addClass('msg error').text(r.message);
                }
            },
            error: function () {
                $('#respuesta').removeClass().addClass('msg error').text('Error al conectar con el servidor.');
            }
        });
    });
</script>

</body>
</html>
