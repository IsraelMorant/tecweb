<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link rel="stylesheet" href="css/login.css"> 
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body class="login">
 <div class="container">
    
        <h1>Dar de Alta Usuario</h1>
   
    

    
    <div class="input-box">
        <input type="text" id="nombre" placeholder="Nombre" />
        <i class='bx bx-user-circle' ></i>
    </div>

    <div class="input-box">
        <input type="text" id="apellidoP" placeholder="Apellido Paterno" />
        <i class='bx bx-user-circle' ></i>
    </div>

     <div class="input-box">
        <input type="text" id="apellidoM" placeholder="Apellido Materno" />
        <i class='bx bx-user-circle' ></i>
    </div>

    <div class="input-box">
        <input type="text" id="usuario" placeholder="Usuario" />
        <i class='bx bx-user-circle' ></i>
    </div>
    
    <div class="input-box">
        <input type="password" id="password" placeholder="Contraseña" />
        <i class='bx bxs-lock-alt' ></i>
    </div>

    
    
    <button class="btn" onclick="window.location.href='index.html'">Regresar</button>
   <button id="singUpBtn" class="btn">Registrarse</button>
    <script src="apps.js"></script><!--Ajustando la direccion a su dirrecion corresponiente-->
</div>

<script>

    
//Para dar de alta a un usurio nuevo

$('#singUpBtn').on('click', function () {
    const data = {
        usuario: $('#usuario').val(),
        password: $('#password').val(),
        nombre: $('#nombre').val(),
        apellidoP: $('#apellidoP').val(),
        apellidoM: $('#apellidoM').val()
    };

    $.ajax({
        url: 'http://localhost:8080/tecweb/Proyecto%20Final/Backend/Api/index.php?method=add_usuario',//Moidifcando el url para cada computadora donde se ejecute, y ajustando correctamente las referencias
        method: 'POST',
        data: JSON.stringify(data),
        contentType: 'application/json',
        success: function (response) {
            const res = JSON.parse(response);
            alert(res.message);
            if (res.status === 'success') {
                // Redirigir al login(index)
                window.location.href = 'index.html';
            }else{
                $('#usuario').val('');
            }
        }
    });
});
</script>
</body>
</html>
