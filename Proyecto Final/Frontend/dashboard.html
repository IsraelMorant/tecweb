<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <!-- <link rel="stylesheet" href="css/styles.css"> -->
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f6f8;
        }

        header {
            background-color: #007bff;
            color: white;
            padding: 15px;
            text-align: center;
        }

        .container {
            margin: 20px auto;
            max-width: 1000px;
        }

        .card {
            background-color: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
            box-shadow: 0px 0px 5px rgba(0,0,0,0.1);
        }

        .card h3 {
            margin: 0 0 10px 0;
        }

        .cards {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .card.small {
            flex: 1;
            min-width: 200px;
            text-align: center;
        }

        .card button {
            margin-top: 10px;
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .card button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<header>
    <h1>Panel de Control</h1>
</header>

<div class="container">
    <div class="cards">
        <div class="card small">
            <h3>Total de Productos</h3>
            <p id="total-productos">...</p>
        </div>
        <div class="card small">
            <h3>Total de Usuarios</h3>
            <p id="total-usuarios">...</p>
        </div>
    </div>

    <div class="card">
        <h3>Acciones Rápidas</h3>
        <button onclick="window.location.href='catalogo.html'">Ver Catálogo</button>
        <button onclick="window.location.href='nuevo-producto.html'">Agregar Producto</button>
    </div>
</div>

<script>
    $(document).ready(function () {
        $.ajax({
            url: 'http://localhost:8080/Proyecto%20Final/Backend/Api/index.php?method=dashboard',
            method: 'GET',
            success: function (res) {
                const data = JSON.parse(res);
                $('#total-productos').text(data.productos);
                $('#total-usuarios').text(data.usuarios);
            }
        });
    });
</script>

</body>
</html>
