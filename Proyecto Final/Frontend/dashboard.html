<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link rel="stylesheet" href="css/dashboard.css">
   
</head>
<body>

<header>
    <h1>Panel de Control</h1>
</header>

<div class="container">
    <div class="cards">
        <div class="card small">
            <h3>Total de Productos</h3>
            <p id="total-productos">...</p>
        </div>
        <div class="card small">
            <h3>Total de Usuarios</h3>
            <p id="total-usuarios">...</p>
        </div>
    </div>

    <div class="card">
        <h3>Acciones Rápidas</h3>
        <button onclick="window.location.href='catalogo.html'">Ver Catálogo</button>
        <button onclick="window.location.href='nuevo_producto.html'">Agregar Producto</button>
        <button onclick="window.location.href='graficas.html'">Ver graficos de Productos</button>
    </div>
</div>

<script>
    $(document).ready(function () {
        $.ajax({
            url: 'http://localhost:8080/tecweb/Proyecto%20Final/Backend/Api/index.php?method=dashboard', //Moidifcando el url para cada computadora donde se ejecute, y ajustando correctamente las referencias
            method: 'GET',
            success: function (res) {
                const data = JSON.parse(res);
                $('#total-productos').text(data.productos);
                $('#total-usuarios').text(data.usuarios);
            }
        });
    });
</script>

</body>
</html>
